<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NORYXO MINI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, #1266ff55, transparent 35%),
        radial-gradient(circle at bottom left, #8b3dff44, transparent 40%),
        #07152f;
      color: white;
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      background: rgba(5,15,35,.75);
      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #9c7cff;
    }

    .new-chat {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    main {
      flex: 1;
      width: min(900px, 94%);
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 35px 0 20px;
    }

    .welcome {
      text-align: center;
      margin: auto 0;
    }

    .ai-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 34px;
      background: linear-gradient(135deg,#6c63ff,#ff67c7);
      box-shadow: 0 15px 50px #704cff55;
    }

    h1 {
      font-size: clamp(30px,5vw,48px);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aebbd2;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
      max-width: 650px;
      margin: auto;
    }

    .card {
      padding: 18px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      cursor: pointer;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.1);
    }

    .card strong {
      display: block;
      margin-top: 8px;
    }

    .composer {
      margin-top: 35px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px;
      background: rgba(255,255,255,.07);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #prompt {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 13px;
    }

    #prompt::placeholder {
      color: #94a3bd;
    }

    .send {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 14px;
      color: white;
      font-size: 20px;
      cursor: pointer;
      background: linear-gradient(135deg,#665cff,#ff62c5);
    }

    footer {
      text-align: center;
      padding: 12px;
      color: #7585a2;
      font-size: 12px;
    }

    @media (max-width:600px) {
      header {
        padding: 0 15px;
      }

      .logo {
        font-size: 19px;
      }

      main {
        padding-top: 20px;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      .welcome {
        margin-top: 35px;
      }
   }
  #aiReply {
  display: none;
  margin: 18px auto;
  max-width: 760px;
  padding: 18px 20px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.12);
  color: white;
  line-height: 1.6;
  white-space: pre-wrap;
  text-align: left;
}  
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">NORYXO <span>MINI</span></div>
    <button class="new-chat" onclick="newChat()">＋ New Chat</button>
  </header>

  <main>

    <section class="welcome">

      <div class="ai-icon">✦</div>

      <h1>How can I help you?</h1>

      <p class="subtitle">
        Ask • Search • Create
      </p>

      <div class="quick-actions">

        <div class="card" onclick="quickPrompt('Help me write something')">
          ✍️
          <strong>Write</strong>
        </div>

        <div class="card" onclick="quickPrompt('Help me search for information')">
          🔎
          <strong>Search</strong>
        </div>

        <div class="card" onclick="quickPrompt('Help me create something')">
          ✨
          <strong>Create</strong>
        </div>

      </div>

    </section>

    <div class="composer">

      <input
        id="prompt"
        type="text"
        placeholder="Message NORYXO MINI..."
        autocomplete="off"
      >

      <button class="send" onclick="sendMessage()">➤</button>

    </div>
<div id="aiReply"></div>
  </main>

  <footer>
    © NORYXO MINI • Personal AI Assistant
  </footer>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://msielrndkqkmpkcloldj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_WC6DrOXZdKzzl9IP4LMvUg_GQMAf75h";
  const promptInput = document.getElementById("prompt");

  function quickPrompt(text) {
    promptInput.value = text;
    promptInput.focus();
  }
const noryxoClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
async function sendMessage() {
  const message = promptInput.value.trim();
  if (!message) return;

  try {
    const { data: { session } } = await noryxoClient.auth.getSession();

    if (!session) {
      window.location.href = "index.html";
      return;
    }

    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/noryxo-ai`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`,
          "apikey": SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ message })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

  document.getElementById("aiReply").textContent = data.reply;
document.getElementById("aiReply").style.display = "block";
  } catch (error) {
    console.error(error);
    alert("NORYXO MINI Error:\n" + error.message);
  }
}

 function newChat() {
  alert("NORYXO MINI button works!");
}

  promptInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

</script>

</body>
</html>
